text: "Accola et Redbridge nous ont aidés à structurer une transaction de haute qualité, optimisée sur tous les aspects financiers. Ils ont joué un rôle essentiel dans ce projet, offrant un service d'un grand professionnalisme, et sont un partenaire sur lequel nous comptons pour l'avenir."
