text: "Grâce à l'expertise et à l'efficacité d'Accola et de Redbridge, NGE a pu étendre son programme de titrisation à SADE dans des conditions financières améliorées et dans un délai serré, permettant ainsi des économies sur le coût du financement de transition vers la titrisation."
name: "Jean-Sébastien Leoni"
position: "Directeur Général Adjoint, NGE"
